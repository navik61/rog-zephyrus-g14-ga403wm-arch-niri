[Service]
# Keep the last 3 versions of installed packages
ExecStart=
ExecStart=/usr/bin/paccache -rk3
# Remove cached packages that are no longer installed
ExecStart=/usr/bin/paccache -ruk0
# Remove leftovers of interrupted downloads (only when pacman is not running)
ExecStart=/bin/sh -c '[ -e /var/lib/pacman/db.lck ] || find /var/cache/pacman/pkg -maxdepth 1 -type d -name "download-*" -exec rm -rf {} +'
